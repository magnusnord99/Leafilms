name: Advance produksjon pipeline

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Call advance-produksjon endpoint
        run: |
          URL=$(gcloud run services describe leafilms-pitch --region europe-north1 --format='value(status.url)')
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$URL/api/cron/advance-produksjon"
